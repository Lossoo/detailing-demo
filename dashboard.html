<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Lead Dashboard</title><style>body{font-family:system-ui;background:#0b1018;color:#eee;padding:24px}main{max-width:1100px;margin:auto}a{color:#62e4b6}button{padding:9px 14px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #344;padding:12px;text-align:left}th{color:#62e4b6}section{overflow-x:auto}.muted{color:#aab}</style></head><body><main><h1>Demo lead tracker</h1><p class="muted">Browser-only demo. Data is stored locally on this device/browser, not shared across devices. For shared lead tracking, use the Google Sheets integration.</p><p><a href="index.html">← Back to landing page</a></p><p id="count"></p><section><table><thead><tr><th>Received</th><th>Name</th><th>Service</th><th>Vehicle</th><th>Source</th><th>Campaign</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section><p><button id="export">Export test leads (CSV)</button> <button id="clear">Clear test leads</button></p></main><script>const key='detail_demo_leads';function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function render(){const data=get();document.getElementById('count').textContent=`${data.length} test inquiries`;const rows=document.getElementById('rows');rows.replaceChildren();for(const lead of data){const tr=document.createElement('tr');for(const field of ['created_at','name','service','vehicle','source','campaign','status']){const td=document.createElement('td');td.textContent=lead[field]||'';tr.append(td)}rows.append(tr)}}document.getElementById('clear').onclick=()=>{if(confirm('Delete all local demo inquiries?')){localStorage.removeItem(key);render()}};document.getElementById('export').onclick=()=>{const fields=['created_at','name','contact','service','vehicle','message','source','medium','campaign','term','status'];const csv=[fields,...get().map(l=>fields.map(k=>l[k]||''))].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='demo-leads.csv';a.click();URL.revokeObjectURL(url)};render();</script></body></html>
